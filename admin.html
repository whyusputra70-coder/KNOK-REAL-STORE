<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - KNOK REAL STORE</title><style>
*{box-sizing:border-box}body{margin:0;background:#09090d;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:20px}.box{background:#121218;border:1px solid #292630;border-radius:18px;padding:18px;margin:12px 0}h1{font-size:25px}h2{font-size:16px;color:#d6b6ff}label{display:block;color:#aaa2ae;font-size:11px;margin:12px 0 5px}input,textarea{width:100%;background:#0b0b0f;color:#fff;border:1px solid #39333f;border-radius:10px;padding:11px}textarea{min-height:75px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:900;cursor:pointer}.save{background:#a855ff;color:#fff}.danger{background:#40202a;color:#fff}.muted{color:#89838f;font-size:11px}.prod{border:1px solid #2a2630;border-radius:14px;padding:14px;margin:10px 0}.preview{max-width:70px;max-height:70px;border-radius:10px}.hidden{display:none}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><h1>🔐 KNOK REAL STORE — ADMIN</h1><p class="muted">Semua yang kamu ubah di sini tersimpan di server dan dipakai halaman publik.</p><div id="login" class="box"><h2>Login Admin</h2><input id="password" type="password" placeholder="Password admin"><button class="btn save" style="margin-top:10px" onclick="login()">MASUK</button></div>
<div id="panel" class="hidden"><div class="box"><h2>⚙ Tampilan & Teks</h2><div class="row"><div><label>Nama Store</label><input id="name"></div><div><label>Tagline</label><input id="tagline"></div></div><label>Judul Hero</label><input id="heroTitle"><label>Teks Hero</label><textarea id="heroText"></textarea><label>Notice</label><input id="notice"><label>Label Menu</label><input id="menuLabel"><label>Footer</label><textarea id="footer"></textarea><div class="row"><div><label>Warna Utama</label><input id="accent" type="color"></div><div><label>Background</label><input id="bg" type="color"></div></div><label>Nomor WhatsApp</label><input id="whatsapp"><button class="btn save" style="margin-top:12px" onclick="saveSettings()">💾 SIMPAN TAMPILAN</button></div>
<div class="box"><h2>💳 QRIS</h2><label>Judul QR</label><input id="qrTitle"><label>Teks QR</label><textarea id="qrText"></textarea><label>Upload gambar QR</label><input type="file" accept="image/*" onchange="uploadQR(this)"><p class="muted" id="qrStatus"></p></div>
<div class="box"><h2>🛒 Produk</h2><div id="productList"></div><button class="btn save" onclick="addProduct()">＋ TAMBAH PRODUK</button></div>
<button class="btn danger" onclick="logout()">KELUAR</button> <button class="btn" onclick="location.href='/'">👁 LIHAT STORE</button></div></div>
<script>
let data;
async function check(){const m=await fetch('/api/me').then(r=>r.json());if(m.admin){loginUI();load()}}
async function login(){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});if(r.ok){loginUI();load()}else alert('Password salah')}
function loginUI(){loginBoxHide();document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden')}
async function load(){data=await fetch('/api/store').then(r=>r.json());const s=data.settings;for(const k of ['name','tagline','heroTitle','heroText','notice','menuLabel','footer','whatsapp','accent','bg','qrTitle','qrText'])if(document.getElementById(k))document.getElementById(k).value=s[k]||'';renderProducts()}
function loginBoxHide(){}
async function saveSettings(){const keys=['name','tagline','heroTitle','heroText','notice','menuLabel','footer','whatsapp','accent','bg','qrTitle','qrText'];const body={};keys.forEach(k=>body[k]=document.getElementById(k).value);const r=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.ok){alert('Tersimpan!');load()}else alert('Gagal')}
async function uploadQR(input){if(!input.files[0])return;const fd=new FormData();fd.append('file',input.files[0]);const r=await fetch('/api/upload',{method:'POST',body:fd});const x=await r.json();if(r.ok){await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({qrImage:x.url})});qrStatus.textContent='QR berhasil diupload';load()}else alert(x.message)}
function renderProducts(){productList.innerHTML=data.products.map((p,i)=>`<div class="prod"><div class="row"><div><label>Nama</label><input id="pn${p.id}" value="${esc(p.name)}"><label>Harga</label><input id="pp${p.id}" value="${esc(p.price)}"><label>Badge</label><input id="pb${p.id}" value="${esc(p.badge)}"></div><div><label>Deskripsi</label><textarea id="pd${p.id}">${esc(p.description)}</textarea><label>Emoji</label><input id="pe${p.id}" value="${esc(p.emoji)}"><label>Gambar Produk</label><input type="file" accept="image/*" onchange="uploadProductImage(this,${p.id})"><span id="pi${p.id}" class="muted">${p.image?'Gambar tersimpan':'Belum ada gambar'}</span></div></div><button class="btn save" onclick="saveProduct(${p.id})">💾 Simpan</button> <button class="btn danger" onclick="deleteProduct(${p.id})">🗑 Hapus</button></div>`).join('')}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function saveProduct(id){const body={name:document.getElementById('pn'+id).value,price:document.getElementById('pp'+id).value,badge:document.getElementById('pb'+id).value,description:document.getElementById('pd'+id).value,emoji:document.getElementById('pe'+id).value};await fetch('/api/products/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});alert('Produk disimpan');load()}
async function uploadProductImage(input,id){if(!input.files[0])return;const fd=new FormData();fd.append('file',input.files[0]);const r=await fetch('/api/upload',{method:'POST',body:fd});const x=await r.json();if(r.ok){await fetch('/api/products/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:x.url})});load()}}
async function deleteProduct(id){if(!confirm('Hapus produk ini?'))return;await fetch('/api/products/'+id,{method:'DELETE'});load()}
async function addProduct(){const r=await fetch('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'PRODUK BARU',price:'Rp0',badge:'',description:'Deskripsi produk',emoji:'🎮',image:''})});if(r.ok)load()}
async function logout(){await fetch('/api/logout',{method:'POST'});location.reload()}check();
</script></body></html>
